<svg viewBox="0 0 860 352" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Output tokens by task tier: honey versus no-skill baseline">
  <title>Output tokens per task tier — honey vs no-skill baseline</title>

  <text x="20" y="26" font-size="15" font-weight="600" fill="#8b949e">Output tokens per tier. 23 tasks, claude-opus-4-8, 345 generations. Lower is leaner.</text>
  <text x="20" y="45" font-size="12" fill="#8b949e" opacity="0.85">Quality is a tie, not a gain: tests pass 97% baseline vs 100% honey, judge 94 ±7 vs 93 ±6.</text>

  <rect x="20" y="58" width="12" height="12" rx="2" fill="#8b949e"/>
  <text x="38" y="69" font-size="13" fill="#8b949e">baseline (no skill)</text>
  <rect x="170" y="58" width="12" height="12" rx="2" fill="#d9a441"/>
  <text x="188" y="69" font-size="13" fill="#8b949e">honey</text>

  <!-- All tasks -->
  <text x="132" y="112" font-size="13" font-weight="600" fill="#8b949e" text-anchor="end">All 23 tasks</text>
  <rect x="140" y="90" width="660" height="14" rx="2" fill="#8b949e"/>
  <text x="806" y="101" font-size="11" fill="#8b949e">90,795</text>
  <rect x="140" y="108" width="560" height="14" rx="2" fill="#d9a441"/>
  <text x="706" y="119" font-size="11" fill="#d9a441" font-weight="600">77,098 · -15%</text>

  <!-- Code -->
  <text x="132" y="176" font-size="13" font-weight="600" fill="#8b949e" text-anchor="end">Code</text>
  <rect x="140" y="154" width="660" height="14" rx="2" fill="#8b949e"/>
  <text x="806" y="165" font-size="11" fill="#8b949e">15,996</text>
  <rect x="140" y="172" width="335" height="14" rx="2" fill="#d9a441"/>
  <text x="481" y="183" font-size="11" fill="#d9a441" font-weight="600">8,126 · -49%</text>

  <!-- Agent-to-agent -->
  <text x="132" y="240" font-size="13" font-weight="600" fill="#8b949e" text-anchor="end">Agent-to-agent</text>
  <rect x="140" y="218" width="660" height="14" rx="2" fill="#8b949e"/>
  <text x="806" y="229" font-size="11" fill="#8b949e">3,244</text>
  <rect x="140" y="236" width="322" height="14" rx="2" fill="#d9a441"/>
  <text x="468" y="247" font-size="11" fill="#d9a441" font-weight="600">1,583 · -51%</text>

  <!-- User-facing -->
  <text x="132" y="304" font-size="13" font-weight="600" fill="#8b949e" text-anchor="end">User-facing UI</text>
