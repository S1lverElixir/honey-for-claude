  <text x="806" y="293" font-size="11" fill="#8b949e">71,555</text>
  <rect x="140" y="300" width="621" height="14" rx="2" fill="#d9a441"/>
  <text x="767" y="311" font-size="11" fill="#d9a441" font-weight="600">67,389 · -6%</text>

  <text x="140" y="336" font-size="10.5" fill="#8b949e" opacity="0.8">Each tier is scaled to its own baseline, so bar lengths compare within a row, not across rows. Source: bench/results/combined.md</text>
</svg>
